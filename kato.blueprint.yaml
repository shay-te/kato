# Reploy deployment blueprint for Kato.
# Schema reference: https://reploy.yadan.net/docs/blueprint-structure
#
# IMPORTANT CAVEATS — read before deploying:
#
# 1. Agent backend: this blueprint only supports KATO_AGENT_BACKEND=openhands.
#    The Claude backend authenticates via `claude login` credentials stored
#    in the HOST machine's keychain, which a container can never reach —
#    kato itself refuses to start with KATO_AGENT_BACKEND=claude inside
#    Docker (see Dockerfile / docker/entrypoint-run.sh). If you need the
#    Claude backend, run kato natively on the host (`pip install -e .` +
#    `kato up`) instead of through this container blueprint.
#
# 2. OpenHands companion service: kato's OpenHands backend needs a reachable
#    OpenHands agent-server at OPENHANDS_BASE_URL (default
#    http://openhands:3000 — see docker-compose.yaml for the reference
#    two-service topology). This blueprint describes the kato app/container
#    alone; provisioning the OpenHands companion service is a separate
#    concern the deploying platform/operator must wire up (a second Reploy
#    app, an existing OpenHands deployment, etc.) — kato will wait at
#    startup for OPENHANDS_BASE_URL to answer before proceeding.
#
# 3. Provider credentials (YouTrack/Jira/Bitbucket/GitHub/GitLab tokens) are
#    normally entered once through the planning UI's Settings drawer and
#    persisted to ~/.kato/settings.json — that's why the whole ~/.kato
#    directory is a managed, writeable, update-preserved path below rather
#    than something rebuilt from env vars on every deploy.

blueprint:
  schema: 1
  version: 0.1.0
  requires_reploy: ">=0.5.0.dev1"

app:
  id: kato
  provider:
    type: python
    identifier: kato

install:
  target:
    default_path: "{{ reploy.install_root }}/{{ app.id }}"
  system:
    run_as:
      user: kato
      group: kato
      on_missing: create
  ports:
    deployed:
      https:
        host_bind: 127.0.0.1
        host_port: 5050
    staging:
      https:
        host_bind: 127.0.0.1
        host_port: 15050
  managed_paths:
    dirs:
      # kato's ONLY state directory: settings.json (provider credentials +
      # config), per-task workspaces/ clones, session transcripts, the
      # local TLS CA + leaf cert the planning webserver generates for
      # itself, and the small JSON stores (tool_decisions.json,
      # forgotten_tasks.json, plan_mode.json, read_only_repos.json, ...).
      # Preserved across updates and writeable at runtime — losing it
      # means losing every stored credential, every in-flight task
      # workspace, and every remembered permission/plan-mode decision.
      - path: .kato
        update: preserve
        mount: /{{ path }}
        writeable: true

bundle:
  options:
    completion_email:
      identifier: kato-completion-email
      group: plugins
      description: >-
        Enable task/failure completion emails
        (KATO_COMPLETION_EMAIL_ENABLED / KATO_FAILURE_EMAIL_ENABLED).

docker:
  deployment_dirs:
    # kato has no config/data split — ~/.kato is the single unified state
    # directory (settings.json config, workspaces, sessions, the TLS cert,
    # small JSON stores). Both point at the same managed path below.
    config: .kato
    data: .kato
    bundle: .reploy/bundle
  service:
    image: python:3.11-slim
  health:
    # kato has no literal "scheme" env var — KATO_WEBSERVER_HTTPS is a
    # boolean flag (default enabled), not a scheme string — so scheme_env
    # is intentionally omitted; default_scheme below is always accurate
    # since HTTPS is on unless explicitly disabled.
    host_env: KATO_WEBSERVER_HOST
    port_env: KATO_WEBSERVER_PORT
    default_scheme: https
    default_host: 127.0.0.1
    default_port: "5050"
    path: /healthz
  install:
    hooks:
      # Reploy requires a `config check` command trigger by convention
      # (see the reference smoke blueprint). kato has no literal "config
      # check" subcommand, so this maps to `kato doctor` — the closest
      # existing equivalent (validates the environment: python deps,
      # provider connectivity, agent CLI availability). Unlike the
      # reference example, kato doctor has no --live flag, so it's run
      # identically before and after start rather than forwarding one.
      before_start:
        - app:
            - config
            - check
      after_start:
        - health_check:
            wait: true
        - app:
            - config
            - check
  default_command: serve
  command_defaults:
    app_command: true
    container:
      argv_prefix: [python, -m, kato_core_lib.main]
  commands:
    serve:
      container:
        # Reploy injects its OWN env vars into the container — it does NOT
        # rename them to whatever docker.health.host_env/port_env say
        # (verified directly against a real `reploy stage` + the generated
        # compose.yaml). kato itself only reads KATO_WEBSERVER_HOST/_PORT,
        # so without a bridge it falls back to its own hardcoded
        # 127.0.0.1:5050 default. The generated compose.yaml has TWO
        # separate pairs, and the distinction matters:
        #   REPLOY_HOST_BIND / REPLOY_HOST_PORT      — the EXTERNAL,
        #     host-side address Docker publishes (e.g. 127.0.0.1:15050).
        #   REPLOY_CONTAINER_HOST / REPLOY_CONTAINER_PORT — what the
        #     process INSIDE the container should actually bind to,
        #     defaulting to 0.0.0.0 (all interfaces), not 127.0.0.1.
        # Binding kato to REPLOY_HOST_BIND (127.0.0.1) *inside* the
        # container would make it unreachable through Docker's port
        # forwarding entirely — a process bound to loopback-only inside
        # its own network namespace can't be reached via the bridge
        # network Docker's `-p host:container` mapping uses. Bind to the
        # CONTAINER pair; Docker's own port mapping handles translating
        # the external host_bind:host_port to this internal address.
        argv_override:
          - sh
          - -c
          - >-
            export KATO_WEBSERVER_HOST="${REPLOY_CONTAINER_HOST:-0.0.0.0}";
            export KATO_WEBSERVER_PORT="${REPLOY_CONTAINER_PORT:-5050}";
            exec python -m kato_core_lib.main "$@"
          - --
    config_check:
      trigger:
        - config
        - check
      app_command: true
      deployed_command: true
      container:
        argv_override: [kato, doctor]
