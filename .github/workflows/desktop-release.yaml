# Kato Desktop — build the installers (.dmg / .msi / .AppImage) + updater feed
# on a version tag. THIS is what actually produces the downloadable files.
#
# ▶ To enable: copy to  .github/workflows/desktop-release.yaml  at the REPO ROOT.
#   GitHub only runs workflows from .github/workflows, so this one file can't
#   physically live under desktop/ — it's kept here as the source of truth.
#
# On a tag like `desktop-v0.1.0`, each OS runner installs kato + PyInstaller,
# freezes the sidecar, then runs the Tauri action to build + sign the installer
# and publish the signed bundles + `latest.json` (the update feed) to a Release.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]

# tauri-action creates the GitHub Release, which needs write access to contents.
permissions:
  contents: write

jobs:
  # The Windows installer ships the LINUX backend binary too, so it can push it
  # into the operator's WSL2 distro at runtime (see desktop/src-tauri/src/wsl.rs).
  # Tauri can't cross-compile it, so a Linux runner freezes it first and the
  # Windows job downloads the artifact before bundling. Without this the Windows
  # build still succeeds — and then fails at runtime with "the Linux backend is
  # missing from this install", which is why the download step is not `continue-on-error`.
  linux-sidecar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install kato + PyInstaller
        shell: bash
        run: |
          python scripts/install_python_deps.py python editable
          python -m pip install pyinstaller
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze the Linux sidecar
        working-directory: desktop
        shell: bash
        env:
          KATO_PYTHON: python
        run: bash sidecar/build-sidecar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kato-sidecar-linux
          path: desktop/src-tauri/binaries/kato-sidecar-x86_64-unknown-linux-gnu
          if-no-files-found: error

  build:
    needs: linux-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   note: "arm64 .dmg" }
          - { os: windows-latest, note: ".msi / nsis .exe" }
          - { os: ubuntu-22.04,   note: ".AppImage / .deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webkit + build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install kato + PyInstaller
        shell: bash
        run: |
          python scripts/install_python_deps.py python editable
          python -m pip install pyinstaller

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Tauri CLI + icons + sidecar
        working-directory: desktop
        shell: bash
        env:
          KATO_PYTHON: python
        run: |
          npm install
          npm run icon
          npm run sidecar

      # Windows only: the Linux backend that gets pushed into the WSL2 distro at
      # runtime. Lands next to the Windows sidecar; tauri.windows.conf.json lists
      # it under bundle.resources so it ends up inside the installer.
      - name: Fetch the Linux backend for the WSL target
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: kato-sidecar-linux
          path: desktop/src-tauri/binaries

      # Apple signing / notarization variables, exported ONLY when their secret
      # is set. A secret that does not exist still arrives as an EMPTY variable,
      # and Tauri treats a set APPLE_CERTIFICATE as "sign this build": it runs
      # `security import` on the empty certificate and the macOS build dies with
      # "failed to import keychain certificate" — while Linux and Windows, which
      # never read these, build fine. Unset, the app is bundled unsigned (as
      # 0.1.0 was); add the secrets and signing turns on with no edit here.
      - name: Apple signing, when configured
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "${name}<<APPLE_SECRET_END"; echo "$value"; echo "APPLE_SECRET_END"; } >> "$GITHUB_ENV"
              echo "${name}: set"
            else
              echo "${name}: not configured — skipped"
            fi
          done

      # The release's text is this version's notes file
      # (desktop/RELEASE_NOTES_<version>.md), so the draft is ready to publish
      # as it lands instead of needing its body pasted in by hand.
      - name: Release notes for this version
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="desktop/RELEASE_NOTES_${version}.md"
          {
            echo 'body<<KATO_RELEASE_NOTES_END'
            if [ -f "$notes" ]; then cat "$notes"; else echo "Kato Desktop ${version}"; fi
            echo
            echo 'KATO_RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      # A tag moved onto a release that is already out (rebuilding it) must
      # REPLACE that release. tauri-action finds a published release only
      # with releaseDraft false: with true it looks for a draft, warns "Found
      # release with tag … but it's NOT a draft!", and creates a duplicate
      # draft — the published one kept its old files. So: a draft only for a
      # release not published yet; a published one gets its files, its
      # latest.json and its notes replaced in place.
      - name: Draft only a release that is not out yet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # releases/tags/<tag> answers only for a PUBLISHED release.
          if gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
              --jq '.draft' 2>/dev/null | grep -qx false; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "${{ github.ref_name }} is published: replacing its files and notes."
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + sign the Tauri app (emits installers + updater feed)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Kato Desktop ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: ${{ steps.release.outputs.draft == 'true' }}
          prerelease: false

      # The installer THIS build made, kept for windows-sign: what SignPath
      # signs is the file built here — not a copy taken back out of the
      # release, which anything that can write the release could swap first.
      - name: Keep the unsigned installer for signing
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # Windows signing through SignPath Foundation — free code signing for
  # open-source projects. Runs only once the project is set up there: the
  # repository VARIABLES SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
  # SIGNPATH_SIGNING_POLICY_SLUG and the SECRET SIGNPATH_API_TOKEN
  # (desktop/signpath/README.md). Until then the installer ships unsigned, as
  # before — nothing here runs.
  #
  # After EVERY build is up, so it never races the jobs merging latest.json:
  # the installer the Windows build kept is signed and put in the draft
  # release in place of the unsigned one. The auto-updater checks a signature
  # made over the installer's exact bytes, so that signature — the .sig asset
  # and its copy in latest.json — is made again over the signed file;
  # otherwise every installed app would refuse the update. Re-running it signs
  # the same built file again, never an already-signed one.
  windows-sign:
    needs: build
    # Not skipped when another platform's build failed (a bare `if:` implies
    # success()): the Windows installer that was built still gets signed, and
    # one that was not makes this job fail loudly instead of a draft silently
    # holding an unsigned installer.
    if: ${{ !cancelled() && vars.SIGNPATH_PROJECT_SLUG != '' }}
    runs-on: ubuntu-latest
    # actions: read — SignPath reads this run's job and its artifact.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the installer the Windows build kept
        id: unsigned
        shell: bash
        run: |
          id="$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "windows-installer-unsigned") | .id' | head -n 1)"
          [ -n "$id" ] || { echo "The Windows build kept no installer to sign — did it fail?"; exit 1; }
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"

      # Waits for the signing — and for an approver to approve it in SignPath
      # (the Foundation requires one per release): up to an hour.
      - name: Sign it (SignPath Foundation)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Sign it for the auto-updater again, over the signed bytes
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          for installer in ../signed/*-setup.exe; do
            npx tauri signer sign "$installer" < /dev/null
          done

      - name: Put the signed installer back, and its signature in latest.json
        shell: bash
        run: |
          shopt -s nullglob
          installers=(signed/*-setup.exe)
          [ ${#installers[@]} -gt 0 ] || { echo "SignPath returned no installer"; exit 1; }
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir feed
          cp feed/latest.json latest.json
          for installer in "${installers[@]}"; do
            name="$(basename "$installer")"
            jq -e --arg name "$name" 'any(.platforms[]; .url | endswith("/" + $name))' latest.json > /dev/null \
              || { echo "latest.json has no entry for $name"; exit 1; }
            gh release upload "$TAG" --repo "$REPO" --clobber "$installer" "$installer.sig"
            # Every platform entry the updater reaches this installer by.
            jq --arg name "$name" --rawfile sig "$installer.sig" \
              '.platforms |= with_entries(if (.value.url | endswith("/" + $name)) then .value.signature = ($sig | rtrimstr("\n")) else . end)' \
              latest.json > latest.next.json
            mv latest.next.json latest.json
          done
          gh release upload "$TAG" --repo "$REPO" --clobber latest.json

